            // Function to parse HTML and convert to React elements
            function parseHTML(htmlString) {
                if (typeof htmlString !== 'string') return htmlString;
                
                const result = [];
                let lastIndex = 0;
                
                // Regular expression to match HTML tags
                const tagRegex = /<\/?(\w+)((?:\s+[\w:]+(?:\s*=\s*(?:"[^"]*"|'[^']*'|[^\s>]+))?)*)\s*\/?>/g;
                let match;
                const stack = [];
                
                while ((match = tagRegex.exec(htmlString)) !== null) {
                    // Add text before the tag
                    if (match.index > lastIndex) {
                        const text = htmlString.substring(lastIndex, match.index);
                        if (stack.length === 0) {
                            result.push(text);
                        } else {
                            stack[stack.length - 1].children.push(text);
                        }
                    }
                    
                    const tagName = match[1].toLowerCase();
                    const isClosing = match[0].startsWith('</');
                    
                    if (isClosing) {
                        if (stack.length > 0 && stack[stack.length - 1].tag === tagName) {
                            const element = stack.pop();
                            if (stack.length === 0) {
                                result.push(element);
                            } else {
                                stack[stack.length - 1].children.push(element);
                            }
                        }
                    } else {
                        const element = {
                            tag: tagName,
                            children: [],
                            self: match[0].endsWith('/')
                        };
                        
                        if (element.self || ['br', 'hr'].includes(tagName)) {
                            if (stack.length === 0) {
                                result.push(element);
                            } else {
                                stack[stack.length - 1].children.push(element);
                            }
                        } else {
                            stack.push(element);
                        }
                    }
                    
                    lastIndex = tagRegex.lastIndex;
                }
                
                // Add remaining text
                if (lastIndex < htmlString.length) {
                    const text = htmlString.substring(lastIndex);
                    if (stack.length === 0) {
                        result.push(text);
                    } else {
                        stack[stack.length - 1].children.push(text);
                    }
                }
                
                // Convert to React elements
                function renderElement(el, idx) {
                    if (typeof el === 'string') {
                        return el;
                    }
                    
                    if (!el.tag) {
                        return el;
                    }
                    
                    const children = el.children.map((child, i) => renderElement(child, i));
                    
                    switch (el.tag) {
                        case 'strong':
                        case 'b':
                            return h('strong', { key: idx, className: 'font-bold' }, children);
                        case 'em':
                        case 'i':
                            return h('em', { key: idx, style: { fontStyle: 'italic' } }, children);
                        case 'p':
                            return h('p', { key: idx, style: { marginBottom: '0.5rem' } }, children);
                        case 'ul':
                            return h('ul', { key: idx, style: { marginLeft: '1.5rem', marginBottom: '0.5rem', listStyleType: 'disc' } }, children);
                        case 'ol':
                            return h('ol', { key: idx, style: { marginLeft: '1.5rem', marginBottom: '0.5rem', listStyleType: 'decimal' } }, children);
                        case 'li':
                            return h('li', { key: idx, style: { marginBottom: '0.25rem' } }, children);
                        case 'br':
                            return h('br', { key: idx });
                        case 'hr':
                            return h('hr', { key: idx, style: { margin: '0.5rem 0', border: 'none', borderTop: '1px solid #e5e7eb' } });
                        default:
                            return h('div', { key: idx }, children);
                    }
                }
                
                return result.map((el, idx) => renderElement(el, idx));
            }

                useEffect(() => {
                    fetchSources();

                // Lukk modal med Esc-tasten
                useEffect(() => {
                    function handleEscKey(e) {
                        if (e.key === 'Escape' && showMetadataModal) {

                        }
                    }

                    return function() {
                        document.removeEventListener('keydown', handleEscKey);
                    };
                }, [showMetadataModal]);

                // Ekstrrahér første setning når tableMetadata endres
                useEffect(() => {
                    let sentence = '';
                    if (tableMetadata && tableMetadata.paragraphs && Array.isArray(tableMetadata.paragraphs)) {
                        for (let i = 0; i < tableMetadata.paragraphs.length; i++) {
                            if (tableMetadata.paragraphs[i].header !== 'Geografi') {
                                let text = tableMetadata.paragraphs[i].content;
                                if (typeof text === 'string') {
                                    const match = text.match(/^[^!?]*?\.(?=\s[A-Z]|$)|^[^!?]*?[!?]/);
                                    if (match) {
                                        // Fjern HTML-tags
                                        sentence = match[0].trim().replace(/<[^>]*>/g, '');
                                        break;
                                    }
                                }
                            }
                        }
                    }
                    setFirstSentence(sentence);
                }, [tableMetadata]);

                async function fetchSources() {
                    setLoading(true);
                    setError(null);
                    try {
                        const response = await fetch(API_BASE + '/Common/source');
                        if (!response.ok) throw new Error('Kunne ikke hente kilder');
                        const data = await response.json();
                        setSources(data);
                        
                        // Fetch all tables for search
                        const promises = data.map(async function(source) {
                            try {
                                const resp = await fetch(API_BASE + '/' + source.id + '/Table');
                                if (resp.ok) {
                                    const tables = await resp.json();
                                    return tables.map(function(table) {
                                        return Object.assign({}, table, { sourceId: source.id, sourceName: source.title || source.name });
                                    });
                                }
                            } catch (e) {
                                return [];
                            }
                            return [];
                        });
                        const results = await Promise.all(promises);
                        const flatTables = results.reduce(function(acc, tables) { return acc.concat(tables); }, []);
                        setAllTables(flatTables);
                    } catch (err) {
                        setError(err.message);
                    } finally {
                        setLoading(false);
                    }
                }

                async function fetchTableLabels() {
                    try {
                        const response = await fetch('./fhi_table_label_mapping.csv');
                        if (!response.ok) throw new Error('Kunne ikke hente tabell-labels (status: ' + response.status + ')');
                        const csvText = await response.text();
                        const labelMap = parseTableLabelsCSV(csvText);
                        setTableLabels(labelMap);
                    } catch (err) {
                        console.error('Kunne ikke hente tabell-labels:', err.message);
                    }
                }

                function parseTableLabelsCSV(text) {
                    const lines = text.split('\n');
                    const result = {};
                    
                    if (lines.length < 2) {
                        console.error('CSV-filen er tom eller har ingen data-linjer');
                        return result;
                    }
                    
                    // Parse header-linjen først
                    const headerLine = lines[0].trim();
                    const separator = ',';

                    // Parse header-celler
                    const headerCells = [];
                    let current = '';
                    let inQuotes = false;
                    
                    for (let j = 0; j < headerLine.length; j++) {
                        const char = headerLine[j];
                        const nextChar = headerLine[j + 1];
                        
                        if (char === '"') {
                            if (inQuotes && nextChar === '"') {
                                current += '"';
                                j++;
                            } else {
                                inQuotes = !inQuotes;
                            }
                        } else if (char === separator && !inQuotes) {
                            headerCells.push(current.trim().replace(/^"|"$/g, ''));
                            current = '';
                        } else {
                            current += char;
                        }
                    }
                    if (current) {
                        headerCells.push(current.trim().replace(/^"|"$/g, ''));
                    }

                    // Parse data-linjer (hopp over header)
                    for (let i = 1; i < lines.length; i++) {
                        const line = lines[i].trim();
                        if (!line) continue;
                        
                        // Parser CSV-linjer med siterte felt
                        const cells = [];
                        let current = '';
                        let inQuotes = false;
                        
                        for (let j = 0; j < line.length; j++) {
                            const char = line[j];
                            const nextChar = line[j + 1];
                            
                            if (char === '"') {
                                if (inQuotes && nextChar === '"') {
                                    current += '"';
                                    j++;
                                } else {
                                    inQuotes = !inQuotes;
                                }
                            } else if (char === separator && !inQuotes) {
                                cells.push(current.trim().replace(/^"|"$/g, ''));
                                current = '';
                            } else {
                                current += char;
                            }
                        }
                        
                        // Siste felt
                        if (current) {
                            cells.push(current.trim().replace(/^"|"$/g, ''));
                        }
                        
                        // Kolonner: 0=source_id, 1=tableId, 2=title, 3=label, 4=category
                        // Hent tableId fra kolonne 2 (indeks 1), label fra kolonne 4 (indeks 3) og category fra kolonne 5 (indeks 4)
                        if (cells.length > 3 && cells[1]) {
                            const tableId = cells[1];
                            const label = cells[3];  // ← label-kolonnen (indeks 3, kolonne 4)
                            const category = cells[4] || '';  // ← category-kolonnen (indeks 4, kolonne 5)
                            
                            if (tableId && label) {
                                // Lagre som objekt med både label og category
                                result[tableId] = {
                                    label: label,
                                    category: category
                                };
                            }
                        }
                    }

                    return result;
                }

                function getTableLabel(table) {
                    if (tableLabels && tableLabels[table.tableId]) {
                        const labelData = tableLabels[table.tableId];
                        // Hvis det er et objekt, hent label-feltet. Ellers (bakoverkompatibilitet) bruk det som string
                        return typeof labelData === 'object' ? labelData.label : labelData;
                    }
                    return table.label || table.title || table.name;
                }
                
                function getTableCategory(table) {
                    if (tableLabels && tableLabels[table.tableId]) {
                        const labelData = tableLabels[table.tableId];
                        return typeof labelData === 'object' ? labelData.category : '';
                    }
                    return '';
                }

                async function fetchTables(sourceId) {
                    setLoading(true);
                    setError(null);
                    try {
                        const response = await fetch(API_BASE + '/' + sourceId + '/Table');
                        if (!response.ok) throw new Error('Kunne ikke hente tabeller');
                        const data = await response.json();
                        setTables(data);
                    } catch (err) {
                        setError(err.message);
                    } finally {
                        setLoading(false);
                    }
                }

                // Helper function to flatten hierarchical categories
                function flattenCategories(categories) {
                    const result = { index: [], label: {} };
                    
                    function traverse(items) {
                        if (!items || !Array.isArray(items)) return;
                        
                        items.forEach(function(item) {
                            if (item.value && item.label) {
                                result.index.push(item.value);
                                result.label[item.value] = item.label;
                            }
                            if (item.children) {
                                traverse(item.children);
                            }
                        });
                    }
                    
                    traverse(categories);
                    return result;
                }

                async function fetchDimensions(sourceId, tableId) {
                    setLoading(true);
                    setError(null);
                    try {
                        const response = await fetch(API_BASE + '/' + sourceId + '/Table/' + tableId + '/dimension');
                        if (!response.ok) throw new Error('Kunne ikke hente dimensjoner');
                        const data = await response.json();
                        
                        // API returnerer et objekt med dimensions property
                        let dimensionsArray = data;
                        
                        // Hvis data er et objekt med dimensions property, hent den
                        if (data && typeof data === 'object' && !Array.isArray(data) && data.dimensions) {
                            dimensionsArray = data.dimensions;
                        }
                        
                        // Sjekk at vi har et array
                        if (!Array.isArray(dimensionsArray)) {
                            console.error('Uventet data format:', data);
                            throw new Error('Kunne ikke finne dimensions i API-responsen');
                        }
                        
                        // Konverter hierarkiske kategorier til flat struktur
                        dimensionsArray = dimensionsArray.map(function(dim) {
                            // Hvis dimensjonen bruker 'categories' (hierarkisk), konverter til 'category' (flat)
                            if (dim.categories && !dim.category) {
                                dim.category = flattenCategories(dim.categories);
                            }
                            return dim;
                        });
                        
                        setDimensions(dimensionsArray);
                        
                        const initialConfig = {};
                        dimensionsArray.forEach(function(dim) {
                            initialConfig[dim.code] = {
                                filter: 'all',
                                values: ['*'],
                                selectedCategories: []
                            };
                        });
                        setQueryConfig(initialConfig);
                    } catch (err) {
                        setError(err.message);
                        setDimensions([]);
                    } finally {
                        setLoading(false);
                    }
                }

                function updateDimensionConfig(dimCode, updates) {
                    setQueryConfig(function(prev) {
                        const newConfig = {};
                        for (var key in prev) {
                            newConfig[key] = prev[key];
                        }
                        newConfig[dimCode] = Object.assign({}, prev[dimCode], updates);
                        return newConfig;
                    });
                }

                function getGeographyGroups(dimension) {
                    if (dimension.code !== 'GEO') return null;
                    if (!dimension.category || !dimension.category.index) return null;
                    
                    const categories = dimension.category.index;
                    const labels = dimension.category.label;
                    const municipalities = [], counties = [], districts = [], others = [];
                    
                    categories.forEach(function(code) {
                        const item = { code: code, label: labels[code] };
                        if (code.length === 6) {
                            districts.push(item);
                        } else if (code.length === 2) {
                            counties.push(item);
                        } else if (code.length === 4) {
                            municipalities.push(item);
                        } else {
                            others.push(item);
                        }
                    });
                    
                    // Build hierarchy
                    const hierarchy = {};
                    counties.forEach(function(county) {
                        hierarchy[county.code] = {
                            municipalities: municipalities.filter(function(m) { 
                                return m.code.startsWith(county.code);
                            }),
                            districts: {}
                        };
                    });
                    
                    // Add districts to municipalities
                    municipalities.forEach(function(mun) {
                        const countyCode = mun.code.substring(0, 2);
                        if (hierarchy[countyCode]) {
                            hierarchy[countyCode].districts[mun.code] = districts.filter(function(d) {
                                return d.code.startsWith(mun.code);
                            });
                        }
                    });
                    
                    return { 
                        municipalities: municipalities, 
                        counties: counties, 
                        districts: districts, 
                        others: others,
                        hierarchy: hierarchy
                    };
                }

                function findMetricDimension(previewData) {
                    // Finn måltall-dimensjon mer fleksibelt
                    const dimNames = previewData.id;
                    let metricDimId = null;
                    
                    // Metode 1: Sjekk role = 'metric'
                    for (let i = 0; i < dimNames.length; i++) {
                        const dimId = dimNames[i];
                        if (previewData.dimension[dimId].role === 'metric') {
                            metricDimId = dimId;
                            break;
                        }
                    }
                    
                    // Metode 2: Sjekk for ContentsCode
                    if (!metricDimId && dimNames.indexOf('ContentsCode') !== -1) {
                        metricDimId = 'ContentsCode';
                    }
                    
                    // Metode 3: Sjekk label (måltall, contents, variabel)
                    if (!metricDimId) {
                        for (let i = 0; i < dimNames.length; i++) {
                            const dimId = dimNames[i];
                            const label = (previewData.dimension[dimId].label || '').toLowerCase();
                            if (label.includes('måltall') || label.includes('contents') || label.includes('variabel')) {
                                metricDimId = dimId;
                                break;
                            }
                        }
                    }
                    
                    return metricDimId;
                }

                function buildFinalQuery() {
                    const query = {
                        dimensions: dimensions.map(function(dim) {
                            const config = queryConfig[dim.code];
                            
                            if (config.filter === 'item') {
                                return {
                                    code: dim.code,
                                    filter: 'item',
                                    values: config.selectedCategories
                                };
                            } else if (config.filter === 'top') {
                                return {
                                    code: dim.code,
                                    filter: 'top',
                                    values: [config.topCount || '5']
                                };
                            } else {
                                return {
                                    code: dim.code,
                                    filter: 'all',
                                    values: config.values && config.values.length > 0 ? config.values : ['*']
                                };
                            }
                        }),
                        response: {
                            format: responseFormat
                        }
                    };
                    
                    if (maxRowCount && maxRowCount !== '') {
                        query.response.maxRowCount = parseInt(maxRowCount);
                    }
                    
                    setFinalQuery(query);
                    setStep(4);
                }

                async function fetchPreview() {
                    if (!finalQuery) return;
                    
                    setLoading(true);
                    setError(null);
                    try {
                        // Lag en kopi av finalQuery, men bruk alltid json-stat2 for forhåndsvisning
                        const previewQuery = JSON.parse(JSON.stringify(finalQuery));
                        previewQuery.response.format = 'json-stat2';

                        const response = await fetch(
                            API_BASE + '/' + selectedSource.id + '/Table/' + selectedTable.tableId + '/data',
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(previewQuery)
                            }
                        );
                        
                        if (!response.ok) {
                            try {
                                const errorData = await response.json();
                                if (errorData.errors) {
                                    const errorMessages = [];
                                    for (const field in errorData.errors) {
                                        errorMessages.push(field + ': ' + errorData.errors[field][0]);
                                    }
                                    throw new Error('Validationsfeil: ' + errorMessages.join(', '));
                                }
                                throw new Error(errorData.message || 'Kunne ikke hente data');
                            } catch (parseError) {
                                throw new Error('Kunne ikke hente preview: ' + response.statusText + ' - ' + parseError.message);
                            }
                        }
                        
                        const contentType = response.headers.get('content-type');
                        let data;
                        
                        if (contentType && contentType.includes('application/json')) {
                            data = await response.json();
                        } else if (contentType && contentType.includes('text/csv')) {
                            // Hvis API returnerer CSV i stedet for JSON, behandle som tekst
                            const csvText = await response.text();
                            data = { csvText: csvText };
                        } else {
                            data = await response.json();
                        }
                        
                        setPreviewData(data);
                    } catch (err) {
                        setError(err.message || 'Feil ved henting av preview');
                    } finally {
                        setLoading(false);
                    }
                }

                function generatePowerQueryCode() {
                    if (!finalQuery || !selectedSource || !selectedTable) return '';
                    
                    const url = API_BASE + '/' + selectedSource.id + '/Table/' + selectedTable.tableId + '/data';
                    const jsonFormatted = JSON.stringify(finalQuery, null, 12).split('\n').join('\n        ');
                    const jsonEscaped = jsonFormatted.replace(/"/g, '""');
                    
                    const powerQueryCode = 'let\n' +
                        '    url="' + url + '",\n' +
                        '    jsonBody= "' + jsonEscaped + '",\n' +
                        '    \n' +
                        '    WebCall = Web.Contents(url, [Headers=[#"Content-Type"="application/json"], Content=Text.ToBinary(jsonBody)]),\n' +
                        '    \n' +
                        '    LinesFromBinary = Lines.FromBinary(WebCall),\n' +
                        '    ConvertToTable = Table.FromList(LinesFromBinary, Splitter.SplitTextByDelimiter(";"), null, null, ExtraValues.Error),\n' +
                        '    #"Promoted Headers" = Table.PromoteHeaders(ConvertToTable, [PromoteAllScalars=true])\n' +
                        'in\n' +
                        '    #"Promoted Headers"';
                    
                    return powerQueryCode;
                }

                // Render step indicator
                function renderStepIndicator() {
                    const steps = [
                        { num: 1, label: 'Kilde' },
                        { num: 2, label: 'Tabeller' },
                        { num: 3, label: 'Variabler' },
                        { num: 4, label: 'Spørring' }
                    ];
                    
                    // Calculate the width of the completed line
                    let completedWidth = 0;
                    if (step > 1) {
                        completedWidth = ((step - 1) / (steps.length - 1)) * 100;
                    }
                    
                    return h('div', { 
                        className: 'step-indicator',
                        style: {
                            '--completed-width': completedWidth + '%'
                        }
                    },
                        h('style', null, 
                            '.step-indicator::after { content: ""; position: absolute; top: calc(1.5rem - 3px); left: calc(1.5rem); height: 6px; background: #3b82f6; z-index: 1; width: calc(var(--completed-width, 0%) - 1.5rem); transition: width 0.3s ease; }'
                        ),
                        steps.map(function(stepItem, idx) {
                            const isCompleted = step > stepItem.num;
                            const isActive = step === stepItem.num;
                            const isClickable = stepItem.num < step || (stepItem.num === 2 && selectedSource) || (stepItem.num === 3 && selectedTable) || stepItem.num === step;
                            
                            let circleClass = 'step-circle ';
                            if (isCompleted) circleClass += 'step-completed';
                            else if (isActive) circleClass += 'step-active';
                            else circleClass += 'step-inactive';
                            
                            return h(React.Fragment, { key: stepItem.num },
                                h('div', {
                                    className: 'step-item ' + (!isClickable ? 'step-disabled' : ''),
                                    role: 'button',
                                    tabIndex: isClickable ? 0 : -1,
                                    'aria-label': 'Steg ' + stepItem.num + ': ' + stepItem.label + (isCompleted ? ' (fullført)' : isActive ? ' (aktiv)' : ''),
                                    'aria-current': isActive ? 'step' : undefined,
                                    onKeyDown: isClickable ? function(e) {
                                        if (e.key === 'Enter' || e.key === ' ') {
                                            e.preventDefault();
                                            if (stepItem.num === 1) setStep(1);
                                            else if (stepItem.num === 2 && selectedSource) setStep(2);
                                            else if (stepItem.num === 3 && selectedTable) setStep(3);
                                            else if (stepItem.num === 4 && finalQuery) setStep(4);
                                        }
                                    } : undefined,
                                    onClick: isClickable ? function() {
                                        if (stepItem.num === 1) setStep(1);
                                        else if (stepItem.num === 2 && selectedSource) setStep(2);
                                        else if (stepItem.num === 3 && selectedTable) setStep(3);
                                        else if (stepItem.num === 4 && finalQuery) setStep(4);
                                    } : undefined
                                },
                                    h('div', { className: circleClass },
                                        isCompleted ? '✓' : stepItem.num
                                    ),
                                    h('div', { className: 'step-label ' + (isCompleted ? 'step-completed' : isActive ? 'step-active' : 'step-inactive') },
                                        stepItem.label
                                    )
                                )
                            );
                        })
                    );
                }

                                                                    key: dim.id,
                                                                    scope: 'col',
                                                                    style: { 
                                                                        padding: '0.5rem', 
                                                                        textAlign: 'left', 
                                                                        borderBottom: '2px solid #d1d5db'
                                                                    } 
                                                                }, dim.label);
                                                            })
                                                        ).concat(
                                                            contentsCategories.map(function(code) {
                                                                return h('th', { 
                                                                    key: code,
                                                                    scope: 'col',
                                                                    style: { 
                                                                        padding: '0.5rem', 
                                                                        textAlign: 'right', 
                                                                        borderBottom: '2px solid #d1d5db'
                                                                    } 
                                                                }, contentsDim.category.label[code]);
                                                            })
                                                        )
                                                    )
                                                ),
                                                h('tbody', null,
                                                    (function() {
                                                        const rows = [];
                                                        for (let i = 0; i < rowsToShow; i++) {
                                                            const key = rowKeys[i];
                                                            const rowData = dataMap[key];
                                                            
                                                            rows.push(
                                                                h('tr', { 
                                                                    key: i,
                                                                    style: { background: i % 2 === 0 ? 'white' : '#f9fafb' }
                                                                },
                                                                    [h('td', { 
                                                                        style: { 
                                                                            padding: '0.5rem', 
                                                                            borderBottom: '1px solid #e5e7eb',
                                                                            fontSize: '0.875rem',
                                                                            fontWeight: '600',
                                                                            minWidth: '80px'
                                                                        } 
                                                                    }, (function() {
                                                                        const geoIdx = otherDimNames.indexOf('GEO');
                                                                        if (geoIdx >= 0 && rowData.dims[geoIdx]) {
                                                                            return String(rowData.dims[geoIdx]);
                                                                        }
                                                                        return '-';
                                                                    })())
                                                                    ].concat(
                                                                        rowData.dims.map(function(catCode, idx) {
                                                                            const dimId = otherDimNames[idx];
                                                                            const label = previewData.dimension[dimId].category.label[catCode];
                                                                            return h('td', { 
                                                                                key: dimId,
                                                                                style: { 
                                                                                    padding: '0.5rem', 
                                                                                    borderBottom: '1px solid #e5e7eb',
                                                                                    fontSize: '0.875rem'
                                                                            } 
                                                                        }, label);
                                                                    })
                                                                    ).concat(
                                                                        contentsCategories.map(function(code) {
                                                                            return h('td', { 
                                                                                key: code,
                                                                                style: { 
                                                                                    padding: '0.5rem', 
                                                                                    textAlign: 'right', 
                                                                                    borderBottom: '1px solid #e5e7eb',
                                                                                    fontSize: '0.875rem',
                                                                                    fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif",
                                                                                    fontWeight: '500'
                                                                                } 
                                                                            }, rowData.values[code] !== undefined ? rowData.values[code] : '-');
                                                                        })
                                                                    )
                                                                    )
                                                            );
                                                        }
                                                        if (rowKeys.length > maxRows) {
                                                            rows.push(
                                                                h('tr', null,
                                                                    h('td', {
                                                                        colSpan: otherDimensions.length + contentsCategories.length + 1,
                                                                        style: {
                                                                            padding: '1rem',
                                                                            textAlign: 'center',
                                                                            fontStyle: 'italic',
                                                                            color: '#6b7280',
                                                                            fontSize: '0.875rem'
                                                                        }
                                                                    }, '... viser første ' + maxRows + ' av ' + rowKeys.length + ' rader. Last ned CSV for alle data.')
                                                                )
                                                            );
                                                        } else if (rowKeys.length > 0) {
                                                            rows.push(
                                                                h('tr', null,
                                                                    h('td', {
                                                                        colSpan: otherDimensions.length + contentsCategories.length,
                                                                        style: {
                                                                            padding: '0.5rem',
                                                                            textAlign: 'center',
                                                                            fontStyle: 'italic',
                                                                            color: '#9ca3af',
                                                                            className: 'text-xs',
                                                                            borderBottom: '1px solid #e5e7eb'
                                                                        }
                                                                    }, 'Viser ' + rowKeys.length + ' rad' + (rowKeys.length !== 1 ? 'er' : '') + ' totalt (' + previewData.value.length + ' verdier, ' + contentsCategories.length + ' måltall)')
                                                                )
                                                            );
                                                        }
                                                        return rows;
                                                    })()
                                                )
                                            );
                                        } else {
                                            // Ingen ContentsCode - bruk original logikk
                                            const dimensions = dimNames.map(function(id) {
                                                return {
                                                    id: id,
                                                    label: previewData.dimension[id].label,
                                                    categories: previewData.dimension[id].category.label
                                                };
                                            });
                                            
                                            const sizes = dimNames.map(function(id) {
                                                return previewData.dimension[id].category.index.length;
                                            });
                                            
                                            const maxRows = 100;
                                            const rowsToShow = Math.min(previewData.value.length, maxRows);
                                            
                                            return h('table', { style: { width: '100%', borderCollapse: 'collapse' } },
                                                h('thead', { style: { background: '#f3f4f6' } },
                                                    h('tr', null,
                                                        [h('th', { 
                                                            scope: 'col',
                                                            style: { 
                                                                padding: '0.5rem', 
                                                                textAlign: 'left', 
                                                                borderBottom: '2px solid #d1d5db',
                                                                fontWeight: '600',
                                                                minWidth: '80px'
                                                            } 
                                                        }, 'GEO-kode')
                                                        ].concat(
                                                            dimensions.map(function(dim) {
                                                                return h('th', { 
                                                                    scope: 'col',
                                                                    style: { 
                                                                        padding: '0.5rem', 
                                                                        textAlign: 'left', 
                                                                        borderBottom: '2px solid #d1d5db'
                                                                    } 
                                                                }, dim.label);
                                                            })
                                                        ).concat([
                                                            h('th', { 
                                                                scope: 'col',
                                                                style: { 
                                                                    padding: '0.5rem', 
                                                                    textAlign: 'right', 
                                                                    borderBottom: '2px solid #d1d5db'
                                                                } 
                                                            }, 'Verdi')
                                                        ])
                                                    )
                                                ),
                                                h('tbody', null,
                                                    (function() {
                                                        const rows = [];
                                                        for (let i = 0; i < rowsToShow; i++) {
                                                            // Beregn multi-dimensjonale indekser (siste dimensjon varierer raskest)
                                                            const indices = [];
                                                            let tempI = i;
                                                            for (let j = dimNames.length - 1; j >= 0; j--) {
                                                                indices[j] = tempI % sizes[j];
                                                                tempI = Math.floor(tempI / sizes[j]);
                                                            }
                                                            
                                                            rows.push(
                                                                h('tr', { 
                                                                    key: i,
                                                                    style: { background: i % 2 === 0 ? 'white' : '#f9fafb' }
                                                                },
                                                                    [h('td', { 
                                                                        style: { 
                                                                            padding: '0.5rem', 
                                                                            borderBottom: '1px solid #e5e7eb',
                                                                            fontSize: '0.875rem',
                                                                            fontWeight: '600',
                                                                            minWidth: '80px'
                                                                        } 
                                                                    }, (function() {
                                                                        // Finn GEO-dimensjonen og hent dens geocode
                                                                        const geoIdx = dimNames.indexOf('GEO');
                                                                        if (geoIdx >= 0 && previewData.dimension.GEO) {
                                                                            const rowIndexInGEO = indices[geoIdx];
                                                                            const geoIndex = previewData.dimension.GEO.category.index;
                                                                            
                                                                            // geoIndex could be array or object
                                                                            if (Array.isArray(geoIndex)) {
                                                                                // If array, the value at this position is the code
                                                                                return String(geoIndex[rowIndexInGEO] || '-');
                                                                            } else if (typeof geoIndex === 'object') {
                                                                                // If object, find the key that maps to this index
                                                                                for (let code in geoIndex) {
                                                                                    if (geoIndex[code] === rowIndexInGEO) {
                                                                                        return code;
                                                                                    }
                                                                                }
                                                                            }
                                                                        }
                                                                        return '-';
                                                                    })())
                                                                    ].concat(
                                                                        dimNames.map(function(id, idx) {
                                                                            const catIndex = previewData.dimension[id].category.index[indices[idx]];
                                                                            const label = previewData.dimension[id].category.label[catIndex];
                                                                            return h('td', { 
                                                                                style: { 
                                                                                    padding: '0.5rem', 
                                                                                    borderBottom: '1px solid #e5e7eb',
                                                                                    fontSize: '0.875rem'
                                                                                } 
                                                                            }, label);
                                                                        })
                                                                    ).concat([
                                                                        h('td', { 
                                                                            style: { 
                                                                                padding: '0.5rem', 
                                                                                textAlign: 'right', 
                                                                                borderBottom: '1px solid #e5e7eb',
                                                                                fontSize: '0.875rem',
                                                                                fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif",
                                                                                fontWeight: '500'
                                                                            } 
                                                                        }, previewData.value[i])
                                                                    ])
                                                                )
                                                            );
                                                        }
                                                        if (previewData.value.length > maxRows) {
                                                            rows.push(
                                                                h('tr', null,
                                                                    h('td', {
                                                                        colSpan: dimensions.length + 2,
                                                                        style: {
                                                                            padding: '1rem',
                                                                            textAlign: 'center',
                                                                            fontStyle: 'italic',
                                                                            color: '#6b7280',
                                                                            fontSize: '0.875rem'
                                                                        }
                                                                    }, '... viser første ' + maxRows + ' av ' + previewData.value.length + ' rader. Last ned CSV for alle data.')
                                                                )
                                                            );
                                                        }
                                                        return rows;
                                                    })()
                                                )
                                            );
                                        }
                                    } else {
                                        return h('div', { className: 'p-4 text-sm text-gray-600' },
                                            'Kan ikke vise tabell for dette dataformatet. Last ned som CSV.'
                                        );
                                    }
                                })()
                            )
                        ),
                        h('div', { className: 'flex gap-2' },
                            h('button', {
                                className: 'btn btn-outline',
                                onClick: function() { setStep(3); }
                            }, 'Tilbake til konfigurasjon'),
                            h('button', {
                                className: 'btn btn-outline',
                                onClick: function() {
                                    setStep(1);
                                    setSelectedSource(null);
                                    setSelectedTable(null);
                                    setDimensions([]);
                                    setQueryConfig({});
                                    setFinalQuery(null);
                                    setPreviewData(null);
                                }
                            }, 'Start på nytt')
                        )
                    );
                }

                // Main render
                return h('div', { className: 'bg-gradient' },
                    h('a', { href: '#main-content', className: 'skip-link' }, 'Gå til hovedinnhold'),
                    renderMetadataModal(),
                    h('div', { className: 'container', id: 'main-content', tabIndex: -1 },
                        h('div', { className: 'text-center mb-8' },
                            h('h1', { className: 'mb-2' }, 'FHI API Query Builder'),
                            h('p', { className: 'text-gray-600' }, 'Bygg spørringer mot FHIs åpne statistikk-API. '),
                            h('p', { className: 'text-gray-600' }, 'Velg kilde, tabell og variabler. Kopier JSON-spørring, innbyggingskode for Power Query eller last ned som CSV-fil.')
                        ),
                        renderStepIndicator(),
                        h('div', { className: 'card' },
                            step === 1 && renderSourceSelection(),
                            step === 2 && renderTableSelection(),
                            step === 3 && renderDimensionConfiguration(),
                            step === 4 && renderQueryResult()
                        ),
                        h('div', { className: 'mt-6 text-center text-sm text-gray-600' },
                            h('p', null,
                                'Data fra ',
                                h('a', {
                                    href: 'https://statistikk-data.fhi.no',
                                    className: 'text-blue-600',
                                    target: '_blank',
                                    rel: 'noopener noreferrer'
                                }, 'FHI Statistikk')
                            ),
                            h('p', { className: 'mt-4' },
                                'Utarbeidet av ',
                                h('a', {
                                    href: 'https://akershusanalyse.no/',
                                    className: 'text-blue-600',
                                    target: '_blank',
                                    rel: 'noopener noreferrer'
                                }, 'Akershus analyse'),
                                ', en del av ',
                                h('a', {
                                    href: 'https://afk.no/',
                                    className: 'text-blue-600',
                                    target: '_blank',
                                    rel: 'noopener noreferrer'
                                }, 'Akershus fylkeskommune')
                            ),
                            h('p', { className: 'mt-2' },
                                'kontakt: ',
                                h('a', {
                                    href: 'mailto:janli@afk.no',
                                    className: 'text-blue-600'
                                }, 'janli@afk.no')
                            )
                        )
                    )
                );
            }

            // Render when DOM is ready
            function mount() {
                ReactDOM.createRoot(document.getElementById('root')).render(h(FHIQueryBuilder));
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', mount);
            } else {
                mount();
            }
        })();
    </script>
</body>
</html>
